# The gate: every push to main, every pull request, and before a release (release.yml calls it). The suite and
# the type declarations' check, on the oldest Node mailcore supports and the current one.
name: ci
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
